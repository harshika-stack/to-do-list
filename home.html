<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Daymark — To-do list</title>
	<style>
		:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#24263b;background:#f6f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:48px 18px}.app{width:min(100%,650px);margin:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:38px}.brand{font-weight:750;font-size:20px;letter-spacing:-.04em}.mark{display:inline-grid;place-items:center;width:32px;height:32px;margin-right:8px;border-radius:10px;background:#7065e8;color:white}.date{font-size:13px;color:#85899d}h1{margin:0 0 8px;font-size:clamp(30px,6vw,40px);letter-spacing:-.05em}.intro{margin:0;color:#85899d;font-size:15px}.card{margin-top:28px;padding:24px;background:white;border:1px solid #eeeef4;border-radius:18px;box-shadow:0 14px 45px #2527460e}.add-form{display:flex;gap:10px}.add-form input{flex:1;min-width:0;padding:13px 14px;border:1px solid #e7e7ef;border-radius:10px;font:inherit;outline:none}.add-form input:focus{border-color:#7065e8;box-shadow:0 0 0 3px #7065e81f}.add-form button{border:0;border-radius:10px;padding:0 18px;background:#7065e8;color:white;font:inherit;font-weight:650;cursor:pointer}.add-form button:hover{background:#5c51d2}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:12px}.filters{display:flex;gap:5px}.filter{border:0;padding:8px 11px;border-radius:8px;background:transparent;color:#85899d;cursor:pointer}.filter.active{background:#f0efff;color:#5c51d2;font-weight:650}.count{color:#85899d;font-size:12px;white-space:nowrap}.tasks{list-style:none;margin:0;padding:0}.task{display:flex;align-items:center;gap:12px;min-height:56px;border-top:1px solid #ececf2}.task input{appearance:none;width:19px;height:19px;flex:none;margin:0;border:1.5px solid #d3d4df;border-radius:50%;cursor:pointer}.task input:checked{border-color:#7065e8;background:#7065e8}.task input:checked:after{content:"✓";display:block;color:white;text-align:center;font-size:12px;line-height:17px}.task-text{flex:1;overflow-wrap:anywhere;font-size:14px}.task.done .task-text{color:#a5a6b2;text-decoration:line-through}.remove{border:0;background:transparent;color:#a6a6b5;font-size:20px;cursor:pointer}.remove:hover{color:#cf5060}.empty{display:none;padding:28px 8px;text-align:center;color:#85899d;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #ececf2;padding-top:14px;color:#85899d;font-size:12px}.clear{border:0;padding:5px;background:transparent;color:#85899d;cursor:pointer}.clear:hover{color:#5c51d2}button:focus-visible,input:focus-visible{outline:3px solid #7065e84d;outline-offset:2px}@media(max-width:480px){body{padding:28px 14px}.card{padding:17px}.add-form button{padding:0 13px}.toolbar{align-items:flex-start;flex-direction:column}.filters{width:100%;justify-content:space-between}.remove{padding:8px}}
	</style>
</head>
<body>
	<main class="app">
		<header class="header"><div class="brand"><span class="mark" aria-hidden="true">✓</span>daymark</div><time class="date" id="date"></time></header>
		<section aria-labelledby="heading"><h1 id="heading">Your day, in focus.</h1><p class="intro">A little progress adds up. What would you like to get done?</p></section>
		<section class="card" aria-label="To-do list">
			<form class="add-form" id="form"><input id="new-task" type="text" maxlength="180" placeholder="Add a task to your list…" aria-label="New task" required><button type="submit">Add task</button></form>
			<div class="toolbar"><nav class="filters" aria-label="Filter tasks"><button class="filter active" data-filter="all" type="button" aria-pressed="true">All</button><button class="filter" data-filter="active" type="button" aria-pressed="false">To do</button><button class="filter" data-filter="done" type="button" aria-pressed="false">Completed</button></nav><span class="count" id="count" aria-live="polite"></span></div>
			<ul class="tasks" id="tasks"></ul><div class="empty" id="empty">☀<br><span id="empty-text">Nothing on your list yet. Add a task to get started.</span></div>
			<footer class="footer"><span id="total"></span><button class="clear" id="clear" type="button">Clear completed</button></footer>
		</section>
	</main>
	<script>
		(()=>{
			const key='daymark-tasks-v1',list=document.getElementById('tasks');let filter='all',items=[];
			try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))items=saved.filter(x=>x&&typeof x.text==='string').map(x=>({id:String(x.id||Math.random()),text:x.text.slice(0,180),done:Boolean(x.done)}))}catch{}
			document.getElementById('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());
			function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch{}}
			function render(){list.replaceChildren();const shown=items.filter(x=>filter==='all'||(filter==='active'?!x.done:x.done));shown.forEach(item=>{const li=document.createElement('li');li.className='task'+(item.done?' done':'');const box=document.createElement('input');box.type='checkbox';box.checked=item.done;box.setAttribute('aria-label',(item.done?'Mark as to do: ':'Complete: ')+item.text);box.onchange=()=>{item.done=box.checked;save();render()};const text=document.createElement('span');text.className='task-text';text.textContent=item.text;const del=document.createElement('button');del.type='button';del.className='remove';del.textContent='×';del.setAttribute('aria-label','Delete '+item.text);del.onclick=()=>{items=items.filter(x=>x.id!==item.id);save();render()};li.append(box,text,del);list.append(li)});const left=items.filter(x=>!x.done).length;document.getElementById('count').textContent=left+' '+(left===1?'task':'tasks')+' left';document.getElementById('total').textContent=items.length+' '+(items.length===1?'task':'tasks')+' total';document.getElementById('empty').style.display=shown.length?'none':'block';document.getElementById('empty-text').textContent=items.length?'No tasks in this view. Looking good!':'Nothing on your list yet. Add a task to get started.';document.getElementById('clear').disabled=!items.some(x=>x.done)}
			document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('new-task'),text=input.value.trim();if(!text)return;items.unshift({id:Date.now()+'-'+Math.random(),text,done:false});input.value='';filter='all';document.querySelectorAll('.filter').forEach(b=>{const active=b.dataset.filter===filter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});save();render();input.focus()});
			document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>{const active=x===b;x.classList.toggle('active',active);x.setAttribute('aria-pressed',String(active))});render()}));
			document.getElementById('clear').addEventListener('click',()=>{items=items.filter(x=>!x.done);save();render()});render();
		})();
	</script>
</body>
</html>
